name: Continuous Delivery

on:
  push:
    branches:
      - main

jobs:
  deliver:
    runs-on: ubuntu-latest

    steps:
      # Baixa o código do repositório para o runner
      - name: checkout do repositório
        uses: actions/checkout@v4

      # Constrói a imagem Docker da aplicação
      - name: build da imagem Docker
        run: |
          docker build -t megasurpresinhas2.0:latest .

      # Converte a imagem em um arquivo para transferi-la entre os jobs
      - name: salva a imagem Docker
        run: |
          docker save megasurpresinhas2.0:latest -o megasurpresinhas2.0.tar

      # Publica a imagem salva como artefato do workflow
      - name: upload da imagem Docker
        uses: actions/upload-artifact@v4
        with:
          name: megasurpresinhas-docker-image
          path: megasurpresinhas2.0.tar

  deploy:
    runs-on: ubuntu-latest
    needs: deliver

    steps:
      # Recupera a imagem construída no job anterior
      - name: download da imagem Docker
        uses: actions/download-artifact@v4
        with:
          name: megasurpresinhas-docker-image

      # Carrega a imagem no Docker do runner atual
      - name: carrega a imagem Docker
        run: |
          docker load -i megasurpresinhas2.0.tar

      # Autentica no Docker Hub usando os secrets do GitHub
      - name: login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Adiciona a tag correspondente ao repositório remoto
      - name: cria tag para o Docker Hub
        run: |
          docker tag megasurpresinhas2.0:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/megasurpresinhas2.0:latest

      # Publica a imagem no Docker Hub
      - name: publica imagem no Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/megasurpresinhas2.0:latest
          