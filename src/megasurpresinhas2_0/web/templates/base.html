<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14532d">
  <meta name="description" content="Gerador de jogos da Mega-Sena e Lotofácil">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <title>{% block title %}MegaSurpresinhas 2.0{% endblock %}</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('web.mega_sena') }}">MegaSurpresinhas <span>2.0</span></a>
    <button id="theme-toggle" class="secondary" type="button" aria-label="Alternar tema">Alternar tema</button>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer><details class="support"><summary>Apoiar o projeto</summary><p>Este app é gratuito. Se desejar, faça uma contribuição voluntária via Pix.</p><img src="{{ url_for('static', filename='img/pix-qrcode.png') }}" alt="QR Code Pix"><label>Pix copia e cola<input id="pix-code" readonly value="00020126580014br.gov.bcb.pix01360f089986-7386-4297-a30c-d2df373d3e3a5204000053039865802BR5923David Do Rosario Maciel6009Sao Paulo62290525REC6950D6D5EFFB45179401606304256C"></label><button id="copy-pix" class="secondary" type="button">Copiar Pix</button></details><p>Jogos aleatórios não aumentam a probabilidade matemática de premiação.</p></footer>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
